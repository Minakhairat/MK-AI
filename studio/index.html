<!doctype html><html dir="rtl" lang="ar"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MK AI Studio (prototype)</title>
<style>body{font-family:sans-serif;max-width:480px;margin:auto;padding:12px;overflow-wrap:anywhere}pre{white-space:pre-wrap}button,input{font-size:16px;margin:2px}input.nm{width:7em}</style><body>
<h3>MK AI Studio – نموذج تجريبي (تصنيف فقط)</h3>
<p id="st">جاري تحميل النموذج الأساسي…</p>
<div id="classes"></div>
<button id="add">+ فئة</button> <button id="train" disabled>درّب</button> <button id="export" disabled>صدّر التطبيق (zip)</button>
<pre id="log"></pre>
<script src="tf.min.js"></script><script src="jszip.min.js"></script>
<script>
const classes=[];let feat,head=null;const log=t=>logEl.textContent+=t+'\n';const logEl=document.getElementById('log');
function addClass(name){const idx=classes.length;classes.push({name,imgs:[]});
 const d=document.createElement('div');d.innerHTML=`<p><input class="nm" value="${name}"> <input type="file" class="fi" accept="image/*" multiple capture="environment"> <span class="cnt">0 صورة</span></p>`;
 d.querySelector('.nm').oninput=e=>classes[idx].name=e.target.value;
 d.querySelector('.fi').onchange=async e=>{for(const f of e.target.files){const im=new Image();im.src=URL.createObjectURL(f);await im.decode();classes[idx].imgs.push(im);}d.querySelector('.cnt').textContent=classes[idx].imgs.length+' صورة';};
 document.getElementById('classes').appendChild(d);}
document.getElementById('add').onclick=()=>addClass('class'+(classes.length+1));addClass('class1');addClass('class2');
const emb=el=>tf.tidy(()=>feat.predict(tf.browser.fromPixels(el).resizeBilinear([224,224]).toFloat().div(127.5).sub(1).expandDims(0)).mean([1,2]));
(async()=>{const full=await tf.loadLayersModel('base/model.json');feat=tf.model({inputs:full.inputs,outputs:full.getLayer('conv_pw_13_relu').output});st.textContent='النموذج الأساسي جاهز';train.disabled=false;window.studioReady=true;})();
document.getElementById('train').onclick=async()=>{
 const n=classes.length;const X=[],Y=[];classes.forEach((c,ci)=>c.imgs.forEach(im=>{X.push(emb(im));Y.push(ci);}));
 if(X.length<n*2){log('محتاج صورتين على الأقل لكل فئة');return;}
 const xs=tf.concat(X),ys=tf.oneHot(Y,n);head=tf.sequential({layers:[tf.layers.dense({inputShape:[xs.shape[1]],units:n,activation:'softmax'})]});
 head.compile({optimizer:tf.train.adam(0.01),loss:'categoricalCrossentropy',metrics:['accuracy']});
 const t0=performance.now();const h=await head.fit(xs,ys,{epochs:60,batchSize:16,verbose:0});
 log('تم التدريب داخل المتصفح في '+Math.round(performance.now()-t0)+' ms. دقة التدريب (مش اختبار): '+h.history.acc.at(-1).toFixed(2));
 window.trainedInBrowser=true;export_.disabled=false;};
const export_=document.getElementById('export');
export_.onclick=async()=>{const w=head.getWeights();const H={task:'classify',classes:classes.map(c=>c.name),D:w[0].shape[0],W:Array.from(await w[0].data()),b:Array.from(await w[1].data())};
 const z=new JSZip();const files=(await (await fetch('template/files.json')).json());
 for(const f of files){z.file(f,await (await fetch('template/'+f)).arrayBuffer());}
 z.file('head.json',JSON.stringify(H));const blob=await z.generateAsync({type:'blob'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mkai-app.zip';a.click();log('تم التصدير');window.exported=true;};
</script></body></html>
