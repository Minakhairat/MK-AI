async function exportClassify(){const aid=crypto.randomUUID().replace(/-/g,'').slice(0,10);const H={task:'classify',classes:S.classes.map(c=>c.name),D:S.head.D,W:S.head.W,b:S.head.b};
 const z=new JSZip();const all=await (await fetch('template/files.json')).json();for(const f of all)z.file(f,await (await fetch('template/'+f)).arrayBuffer());
 z.file('head.json',JSON.stringify(H));z.file('manifest.json',JSON.stringify({name:'MK AI classifier '+aid,short_name:'MK AI '+aid.slice(0,4),id:'mkai-cls-'+aid,start_url:'./',scope:'./',display:'standalone',background_color:'#1e2127',theme_color:'#1e2127',icons:[{src:'pwa-192x192.png',sizes:'192x192',type:'image/png'},{src:'pwa-512x512.png',sizes:'512x512',type:'image/png'}]}));
 const F=['./',...all.map(f=>'./'+f),'./head.json','./manifest.json'],C='mkai-cls-'+aid;
 z.file('sw.js',`const P=${JSON.stringify('mkai-cls-')},T='@'+self.registration.scope,C=${JSON.stringify(C)}+T;const F=${JSON.stringify(F)};self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(C).then(c=>c.addAll(F)));});self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k.startsWith(P)&&k.endsWith(T)&&k!==C).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.open(C).then(c=>c.match(e.request).then(r=>r||fetch(e.request))));});`);
 const b=await z.generateAsync({type:'blob'});$('a',{href:URL.createObjectURL(b),download:'mkai-classifier-'+aid+'.zip'}).click();S.exported=true;window.exported=true;window.appId=aid;render();}

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
