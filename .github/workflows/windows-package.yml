name: windows-package
on:
  workflow_dispatch:
  push:
    paths: ['windows-package.version']
concurrency:
  group: windows-package
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Prepare studio assets (Node is needed only here, not in the package)
        run: |
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          npm install && npm run setup
      - name: Assemble the portable folder (embedded Python 3.12, offline packages, pretrained model)
        run: |
          set -e
          P=pkg/MK-AI
          mkdir -p $P $P/hf
          curl -fsSL -o embed.zip https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          7z x -y -o$P/python embed.zip >/dev/null
          printf '%s\r\n' 'python312.zip' '.' 'Lib\site-packages' > $P/python/python312._pth
          mkdir -p $P/python/Lib/site-packages
          python -m pip freeze | grep -v '^torch\|^torchvision\| @ ' > constraints.txt
          echo '--- constraints (versions proven in the runner env that runs the same pipeline):'; grep -i '^transformers\|^timm\|^huggingface\|^onnx\|^numpy\|^scipy' constraints.txt
          python -m pip install --target $P/python/Lib/site-packages torch==2.6.0 torchvision==0.21.0 -r requirements.txt -c constraints.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          PYTHONPATH=$P/python/Lib/site-packages python -c "import torch,transformers;from transformers import RTDetrForObjectDetection;print('import OK',torch.__version__,transformers.__version__)"
          python -c "from huggingface_hub import snapshot_download as s; print(s('PekingU/rtdetr_r18vd', cache_dir='$P/hf'))"
          mkdir -p $P/build
          cp -r server trainer studio $P/
          cp -r build/detect-template $P/build/
          cat > $P/MK-AI.bat <<'BAT'
          @echo off
          cd /d "%~dp0"
          rem Prerequisite: Microsoft Visual C++ Redistributable 2015-2022 (x64). Not bundled (Microsoft limits redistribution of those files).
          set HAVE_VCRT=0
          reg query "HKLM\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64" /v Installed 2>nul | find "0x1" >nul && set HAVE_VCRT=1
          if "%MKAI_FORCE_NO_VCRT%"=="1" set HAVE_VCRT=0
          if "%HAVE_VCRT%"=="0" (
            echo [MK AI] One free Microsoft component is missing: Microsoft Visual C++ Redistributable ^(x64^).
            echo [MK AI] Download and install it from Microsoft: https://aka.ms/vc14/vc_redist.x64.exe
            echo [MK AI] Then run this file again.
            if not "%MKAI_NOBROWSER%"=="1" pause
            exit /b 2
          )
          set HF_HUB_CACHE=%~dp0hf
          set HF_HUB_OFFLINE=1
          set PYTHONNOUSERSITE=1
          echo [MK AI] Starting. A browser tab opens at http://127.0.0.1:8000 . Keep this window open while you use MK AI. Close it to stop.
          if not "%MKAI_NOBROWSER%"=="1" start "" http://127.0.0.1:8000
          python\python.exe server\studio_server.py 8000
          echo [MK AI] The server stopped. If this was not expected, read the messages above.
          if not "%MKAI_NOBROWSER%"=="1" pause
          BAT
          sed -i 's/^          //; s/$/\r/' $P/MK-AI.bat
          cat $P/MK-AI.bat | head -4
          du -sh $P
      - name: Licenses, notices and contents audit
        run: |
          set -e
          P=pkg/MK-AI
          mkdir -p $P/licenses/python-packages
          python - <<'PYEOF'
          import os,glob,shutil,json,sys
          from importlib import metadata
          sp='pkg/MK-AI/python/Lib/site-packages'
          rows=[]
          for d in sorted(glob.glob(sp+'/*.dist-info')):
              md=open(d+'/METADATA',encoding='utf-8',errors='ignore').read().split('\n\n')[0]
              name=ver=lic='';cls=[]
              for l in md.split('\n'):
                  if l.startswith('Name: '):name=l[6:]
                  elif l.startswith('Version: '):ver=l[9:]
                  elif l.startswith('License-Expression: '):lic=l[20:]
                  elif l.startswith('License: ') and not lic:lic=l[9:][:80]
                  elif l.startswith('Classifier: License'):cls.append(l.split('::')[-1].strip())
              rows.append((name,ver,lic or '; '.join(cls) or 'UNSPECIFIED'))
              dst='pkg/MK-AI/licenses/python-packages/'+name
              for f in glob.glob(d+'/**/*',recursive=True):
                  b=os.path.basename(f).upper()
                  if os.path.isfile(f) and any(k in b for k in ('LICENSE','LICENCE','COPYING','NOTICE')):
                      os.makedirs(dst,exist_ok=True);shutil.copy(f,dst)
          with open('pkg/MK-AI/licenses/PACKAGES.txt','w') as o:
              o.write('Python packages bundled in this folder (name, version, declared license)\n\n')
              for r in rows:o.write('%s %s : %s\n'%r)
          print(len(rows),'packages');print('UNSPECIFIED:',[r[0] for r in rows if r[2]=='UNSPECIFIED'])
          PYEOF
          cp $P/python/LICENSE.txt $P/licenses/PYTHON-LICENSE.txt 2>/dev/null || echo "no python LICENSE.txt in embed zip"
          ls $P/python | head -30
          cat > $P/licenses/README-NOTICES.txt <<'TXT'
          MK AI portable package, third-party material
          - Python 3.12 embeddable distribution (PSF license), see PYTHON-LICENSE.txt.
          - Python packages listed in PACKAGES.txt, each with the license files shipped by its wheel in python-packages/.
          - PekingU/rtdetr_r18vd (detector backbone, needed for local training; NOT a user-trained model). Hugging Face model metadata lists Apache-2.0. Pretrained on COCO (mixed Flickr image terms; effect on weights not assessed). See hf/ (model card and files as downloaded).
          - Studio assets (ONNX Runtime Web, JSZip, TensorFlow.js, MobileNetV3 backbone) carry their own notices in studio/template and build/detect-template (THIRD-PARTY-NOTICES.txt, NOTICE-MODEL.txt).
          - No datasets, no trained models and no benchmark weights are included.
          TXT
          sed -i 's/^          //' $P/licenses/README-NOTICES.txt
          # contents audit: fail on datasets / trained artifacts
          echo "--- all .onnx/.pt/.pth/.safetensors/.bin/.zip files outside site-packages:"
          find $P -type f \( -name '*.onnx' -o -name '*.pt' -o -name '*.pth' -o -name '*.safetensors' -o -name '*.zip' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' \) -not -path "$P/python/Lib/site-packages/*" -printf '%s %p\n' | sort -k2 | tee /tmp/audit.txt
          if grep -i 'bloodcell\|blood\|oxford\|benchmark\|app\.zip\|best\.' /tmp/audit.txt; then echo 'AUDIT FAIL: dataset or trained artifact found'; exit 1; fi
          if [ -d $P/build/job ] || [ -d $P/data ]; then echo 'AUDIT FAIL'; exit 1; fi
          echo "AUDIT OK: only pretrained backbones/template assets"
      - name: Dependency, VC++ runtime and licence review
        run: |
          set -e
          exec > >(tee /tmp/review.log) 2>&1
          pip install pefile >/dev/null
          P=pkg/MK-AI
          # backbone licence material: Apache-2.0 text + the model card as downloaded
          cp "$(ls $P/python/Lib/site-packages/transformers-*.dist-info/licenses/LICENSE 2>/dev/null | head -1)" $P/licenses/APACHE-2.0.txt || cp $(find $P/python/Lib/site-packages -maxdepth 3 -ipath '*transformers*' -iname 'LICENSE*' | head -1) $P/licenses/APACHE-2.0.txt
          head -3 $P/licenses/APACHE-2.0.txt
          cp $(find $P/hf -iname 'README.md' | head -1) $P/licenses/PekingU-rtdetr_r18vd-MODEL-CARD.md
          cat > /tmp/audit.py <<'PYEOF'
          import pefile,os,glob,shutil,re,collections,sys
          root='pkg/MK-AI'
          def scan():
              have={}
              for dp,_,fs in os.walk(root):
                  for f in fs:
                      if f.lower().endswith(('.dll','.pyd','.exe')): have.setdefault(f.lower(),os.path.join(dp,f))
              need=collections.defaultdict(set)
              for n,path in have.items():
                  try:
                      pe=pefile.PE(path,fast_load=True);pe.parse_data_directories(directories=[1])
                      for e in getattr(pe,'DIRECTORY_ENTRY_IMPORT',[]):need[e.dll.decode().lower()].add(n)
                  except Exception as ex: print('skip',path,ex)
              return have,need
          VC=re.compile(r'^(msvcp\d+|vcruntime\d+(_\d+)?|concrt\d+|vcomp\d+|vcamp\d+|msvcr\d+)(_\d+)?\.dll$')
          def classify(have,need):
              out=collections.defaultdict(list)
              for d in sorted(need):
                  if d in have: continue
                  if d.startswith(('api-ms-win-','ext-ms-win-')) or d=='ucrtbase.dll': out['UCRT_or_apiset'].append(d)
                  elif VC.match(d): out['VC_RUNTIME_NOT_BUNDLED'].append(d)
                  elif os.path.exists('C:/Windows/System32/'+d): out['windows_system'].append(d)
                  else: out['UNRESOLVED'].append(d)
              return out
          have,need=scan();c=classify(have,need)
          print('BEFORE bundling:',{k:v for k,v in c.items() if k!='windows_system'})
          print('windows_system DLLs used:',c.get('windows_system'))
          print('NOT bundling Microsoft VC++ runtime DLLs (Microsoft limits their redistribution to licensed Visual Studio users); the launcher checks for the Microsoft redistributable instead')
          have,need=scan();c=classify(have,need)
          if c.get('UNRESOLVED'): print('UNRESOLVED deps (inspect, may be delay-load or optional):',c['UNRESOLVED'])
          print('VC runtime DLLs required from the machine:',c.get('VC_RUNTIME_NOT_BUNDLED'))
          print('DEP AUDIT DONE')
          PYEOF
          python /tmp/audit.py
          echo '--- torch/lib DLLs:'; ls $P/python/Lib/site-packages/torch/lib/*.dll | xargs -n1 basename | tr '\n' ' '; echo
          echo '--- licence review: licence files per package with copyleft/non-commercial keyword hits'
          cd $P/licenses/python-packages
          for d in *; do for f in $d/*; do h=$(grep -il -E 'GNU (Lesser |Affero )?General Public|LGPL|AGPL|non-?commercial|CC-BY-NC|academic use only|research use only' "$f" 2>/dev/null || true); [ -n "$h" ] && echo "KEYWORD HIT: $f"; done; done
          echo '--- first licence line of each package'; for d in *; do f=$(ls $d | head -1); echo "$d : $(grep -v '^\s*$' "$d/$f" | head -1 | cut -c1-90)"; done
          cd - >/dev/null
          cat $P/licenses/PACKAGES.txt | head -80
          find $P/hf -type f -printf '%s %p\n' | sort -k2 | head -20
          sleep 1
          { echo '### Dependency / VC++ runtime / licence review (build log)'; echo '```'; cat /tmp/review.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Zip (not uploaded anywhere)
        run: |
          cd pkg && 7z a -tzip -mx=5 ../MK-AI-Windows-portable.zip MK-AI >/dev/null
          cd ..
          ls -la MK-AI-Windows-portable.zip
          { echo "unpacked bytes: $(du -sb pkg/MK-AI | cut -f1)"; echo "### Portable package built (private CI build, NOT uploaded or published)"; echo "size bytes: $(stat -c %s MK-AI-Windows-portable.zip)"; echo "sha256: $(sha256sum MK-AI-Windows-portable.zip | cut -d' ' -f1)"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Clean-machine test (fresh folder, no system Python or Node on PATH, offline model)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force pkg
          7z x -y -oC:\clean MK-AI-Windows-portable.zip | Out-Null
          $root = 'C:\clean\MK-AI'
          $sys = "$env:SystemRoot\System32"
          # 0) real outbound network block for everything (loopback stays allowed by Windows)
          New-NetFirewallRule -DisplayName 'mkai-block-python' -Direction Outbound -Program "$root\python\python.exe" -Action Block | Out-Null
          Set-Content C:\clean\nettest.py "import urllib.request`ntry:`n    urllib.request.urlopen('https://pypi.org',timeout=15);print('REACHED')`nexcept Exception as e:`n    print('BLOCKED',type(e).__name__)"
          $t = & "$root\python\python.exe" C:\clean\nettest.py
          Write-Host "bundled python outbound test: $t"
          if ($t -notmatch 'BLOCKED') { throw 'outbound not blocked for bundled python' }
          $env:MKAI_FORCE_NO_VCRT = '1'
          $neg = cmd /c "cd /d $root && MK-AI.bat" 2>&1
          $negcode = $LASTEXITCODE
          Write-Host ($neg -join "`n")
          Write-Host "missing-runtime branch exit code: $negcode"
          if ($negcode -ne 2 -or (($neg -join ' ') -notmatch 'aka.ms/vc14/vc_redist.x64.exe')) { throw 'missing-runtime branch did not behave' }
          Remove-Item Env:MKAI_FORCE_NO_VCRT
          # 1) the launcher starts the local Studio using only the bundled Python
          $env:MKAI_NOBROWSER = '1'
          $p = Start-Process cmd -ArgumentList '/c', "set PATH=$sys&& cd /d $root && MK-AI.bat > C:\clean\launcher.log 2>&1" -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep 4
            try { $r = Invoke-RestMethod http://127.0.0.1:8000/api/status -TimeoutSec 5; if ($r.state -eq 'idle') { $ok = $true; break } } catch {}
          }
          Get-Content C:\clean\launcher.log -Tail 20
          if (-not $ok) { throw 'bundled launcher did not serve' }
          $h = Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing
          if ($h.StatusCode -ne 200) { throw 'studio page not served' }
          Write-Host 'launcher OK: status idle, page 200'
          New-Item -ItemType Directory C:\shots -Force | Out-Null
          Push-Location C:\shots
          $chrome = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          & $chrome --headless=new --disable-gpu --no-sandbox --window-size=1100,800 --screenshot=C:\shots\studio.png http://127.0.0.1:8000/ | Out-Host
          Start-Sleep 3
          Pop-Location
          if (-not (Test-Path C:\shots\studio.png)) { throw 'no screenshot' }
          Write-Host ('screenshot bytes ' + (Get-Item C:\shots\studio.png).Length)
          Write-Host 'PNGB64START'; [Convert]::ToBase64String([IO.File]::ReadAllBytes('C:\shots\studio.png')) | Write-Host; Write-Host 'PNGB64END'
          taskkill /T /F /PID $p.Id | Out-Null
          # 2) the bundled Python trains and exports the detector offline (pretrained model from the package)
          $env:HF_HUB_CACHE = "$root\hf"; $env:HF_HUB_OFFLINE = '1'; $env:PYTHONNOUSERSITE = '1'
          $env:PATH = $sys
          Set-Location $root
          & "$root\python\python.exe" -c "import sys,torch,transformers,onnxruntime;print(sys.version);print('torch',torch.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "python import check exit $LASTEXITCODE" }
          Set-Content C:\clean\mods.py "import ctypes,ctypes.wintypes as w,os`nimport torch,transformers,onnxruntime`nfrom transformers import RTDetrForObjectDetection`nk=ctypes.WinDLL('kernel32');ps=ctypes.WinDLL('psapi')`nk.GetCurrentProcess.restype=w.HANDLE`nh=k.GetCurrentProcess();arr=(w.HMODULE*2048)();n=w.DWORD()`nps.EnumProcessModules(h,arr,ctypes.sizeof(arr),ctypes.byref(n))`nbuf=ctypes.create_unicode_buffer(1024);bad=[]`nfor i in range(n.value//ctypes.sizeof(w.HMODULE)):`n    ps.GetModuleFileNameExW(h,arr[i],buf,1024);p=buf.value;b=os.path.basename(p).lower()`n    if b.startswith(('msvcp','vcruntime','concrt','vcomp')):`n        print('VCRT',p)`n        if not p.lower().startswith('c:\\clean'): bad.append(p)`nprint('VCRT_FROM_SYSTEM:',bad)"
          $modsout = & "$root\python\python.exe" C:\clean\mods.py
          $modsout | Out-Host
          Add-Content $env:GITHUB_STEP_SUMMARY ("### Clean-machine loaded VC runtime modules`n``````n" + ($modsout -join "`n") + "`n``````")
          & "$root\python\python.exe" trainer\selftest.py
          if ($LASTEXITCODE -ne 0) { throw "selftest exit $LASTEXITCODE" }
          Write-Host 'clean-machine detector self-test OK (synthetic data, pipeline check only)'
