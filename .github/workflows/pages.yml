name: pages
on:
  push:
    paths: ['site.version']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install timm onnx onnxscript
          npm install && npm run setup
      - name: Assemble site (only the Apache-2.0 backbone export is published)
        run: |
          mkdir -p site
          cp studio/index.html studio/jszip.min.js studio/ort.min.js studio/ort-wasm-simd-threaded.* site/
          cp -r studio/template site/template
          cp -r studio/base site/base
      - name: Fail if unexpected model files are in the site
        run: |
          find site -name '*.onnx' | sort
          test "$(find site -name '*.onnx' | wc -l)" = "2"
          find site -name '*.bin' -o -name '*.pt' -o -name '*.pth' | grep . && exit 1 || true
      - uses: actions/upload-pages-artifact@v4
        with: { path: site }
      - id: dep
        uses: actions/deploy-pages@v4
