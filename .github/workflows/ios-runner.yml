name: ios-runner
on:
  workflow_dispatch:
  push:
    paths: ['ios.version']
concurrency:
  group: ios-runner
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Assets and the CI-only synthetic classify test zip (pipeline check only)
        run: |
          pip install torch==2.6.0 torchvision==0.21.0 -r requirements.txt
          npm install && npm run setup
          python android-runner/prep_classify_zip.py studio/base/feat.onnx build/test-classify.zip
          python trainer/selftest.py
          ls -la build/selftest/out/app.zip build/test-classify.zip | tee -a "$GITHUB_STEP_SUMMARY"
          cp build/selftest/out/app.zip build/test-detect.zip
      - name: Generate the native iOS project (Capacitor 7), unsigned
        run: |
          mkdir -p wrap/www && cd wrap
          cp ../android-runner/www/* www/
          cp ../studio/jszip.min.js ../studio/ort.min.js ../studio/ort-wasm-simd-threaded*.mjs ../studio/ort-wasm-simd-threaded*.wasm www/
          cp ../build/test-classify.zip ../build/test-detect.zip www/
          echo "window.MKAI_TEST=localStorage.getItem('ci_launch')?undefined:['test-classify.zip','test-detect.zip'];" > www/test-config.js
          cp ../android-runner/ios/ci-relaunch.js www/
          cat > www/ci-out.js <<'JS'
          (function(){const o=document.createElement('pre');o.id='ciout';o.style.cssText='white-space:pre-wrap;font:12px monospace;color:#9f9;direction:ltr;text-align:left;border-top:1px solid #444;margin-top:12px';document.body.appendChild(o);const l=console.log;console.log=function(){l.apply(console,arguments);const m=String(arguments[0]);if(/MKAI_/.test(m))o.textContent+=m.replace(/^.*MKAI_/,'MKAI_')+'\n';};window.addEventListener('error',e=>{o.textContent+='JSERROR '+e.message+'\n';});})();
          const of=window.fetch;window.fetch=function(u){const s=String(u);if(/test-(classify|detect)\.zip$/.test(s))return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('GET',s);x.responseType='blob';x.onload=()=>res({blob:()=>Promise.resolve(x.response)});x.onerror=()=>rej(new Error('xhr fail'));x.send();});return of.apply(this,arguments);};
          console.log('MKAI_PROBE origin='+location.origin+' secure='+window.isSecureContext+' caches='+(typeof caches)+' wasm='+(typeof WebAssembly)+' getUserMedia='+!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia));
          JS
          # iOS-only files (the shared runner source and the Android APK are NOT changed)
          cp ../android-runner/ios/ios-compat.js www/
          echo "body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}" > www/ios-safe.css
          sed -i '' 's#width=device-width,initial-scale=1#width=device-width,initial-scale=1,viewport-fit=cover#; s#<link rel="stylesheet" href="runner.css">#<link rel="stylesheet" href="runner.css"><link rel="stylesheet" href="ios-safe.css">#; s#<script src="runner.js">#<script src="ci-out.js"></script><script src="ios-compat.js"></script><script src="test-config.js"></script><script src="ci-relaunch.js"></script><script src="runner.js">#' www/index.html
          grep -c "ios-safe.css" www/index.html; grep -c "viewport-fit=cover" www/index.html
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7
          npx cap init "MK AI Runner" com.mkai.runner --web-dir www
          npx cap add ios
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string MK AI uses the camera to run your model on live frames." ios/App/App/Info.plist
          python ../android-runner/ios_icon.py ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png ../brand/icons.json
          test -s ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png && python3 -c "import struct;d=open('ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png','rb').read(32);print('icon png',struct.unpack('>II',d[16:24]))" | tee -a "$GITHUB_STEP_SUMMARY"
          ls ios/App/App/Assets.xcassets/AppIcon.appiconset
          npx cap sync ios
      - name: Build for the iOS Simulator and for a device, both with code signing OFF (real exit codes, errors printed)
        run: |
          cd wrap/ios/App
          S="$GITHUB_STEP_SUMMARY"
          xcodebuild -version | tee -a "$S"
          ls -d *.xcworkspace Pods 2>&1 | tee -a "$S"; (xcodebuild -workspace App.xcworkspace -list 2>&1 | head -25) | tee -a "$S"
          RC=0; xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath ../build-sim CODE_SIGNING_ALLOWED=NO build > ../sim-build.log 2>&1 || RC=$?; echo "simulator xcodebuild exit=$RC" | tee -a "$S"; echo $RC > ../sim.rc
          { grep -E "error:|BUILD (SUCCEEDED|FAILED)|\*\* " ../sim-build.log | head -15; echo '--- last lines'; tail -12 ../sim-build.log; } 2>&1 | cut -c1-300 | tee -a "$S"
          RC=0; xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath ../build-dev CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > ../dev-build.log 2>&1 || RC=$?; echo "device xcodebuild exit=$RC" | tee -a "$S"; echo $RC > ../dev.rc
          { grep -E "error:|BUILD (SUCCEEDED|FAILED)|\*\* " ../dev-build.log | head -15; echo '--- last lines'; tail -12 ../dev-build.log; } 2>&1 | cut -c1-300 | tee -a "$S"
          echo '--- .app bundles found' | tee -a "$S"; find ../build-sim ../build-dev -name '*.app' -maxdepth 6 | tee -a "$S"
          for A in $(find ../build-dev -name 'App.app' -maxdepth 6 | head -1) $(find ../build-sim -name 'App.app' -maxdepth 6 | head -1); do
            { echo "--- $A"; ls -la "$A" | head -20; file "$A/App"; lipo -info "$A/App"; plutil -p "$A/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleExecutable|MinimumOSVersion|DTPlatformName'; codesign -dv "$A" 2>&1 | head -3; } 2>&1 | tee -a "$S"
          done
      - name: Require real app binaries
        run: |
          cd wrap/ios
          [ "$(cat sim.rc)" = 0 ] && [ "$(cat dev.rc)" = 0 ] && test -f build-sim/Build/Products/Debug-iphonesimulator/App.app/App && test -f build-dev/Build/Products/Release-iphoneos/App.app/App || { echo "iOS build failed or no executable: sim.rc=$(cat sim.rc) dev.rc=$(cat dev.rc)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: Run in the iOS Simulator, screenshot, RELAUNCH, screenshot again
        timeout-minutes: 20
        run: |
          set +e
          S="$GITHUB_STEP_SUMMARY"
          DEV=$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | grep -oE '[0-9A-F-]{36}')
          echo "simulator $DEV" | tee -a "$S"
          xcrun simctl boot $DEV; perl -e 'alarm 240; exec @ARGV' xcrun simctl bootstatus $DEV -b; echo "bootstatus exit=$?" | tee -a "$S"
          APP=$(find wrap/ios/build-sim -name 'App.app' -maxdepth 6 | head -1); echo "installing $APP" | tee -a "$S"
          for t in 1 2; do perl -e 'alarm 240; exec @ARGV' xcrun simctl install $DEV "$APP"; r=$?; echo "install try$t exit=$r" | tee -a "$S"; [ $r = 0 ] && break; done; echo "install exit=$r" | tee -a "$S"
          xcrun simctl launch $DEV com.mkai.runner 2>&1 | tee -a "$S"
          sleep 150
          xcrun simctl spawn $DEV launchctl list 2>&1 | grep -i mkai | tee -a "$S"
          xcrun simctl io $DEV screenshot ios-shot1.png
          echo "--- terminate and relaunch (same install, same data)" | tee -a "$S"
          xcrun simctl terminate $DEV com.mkai.runner; sleep 3
          xcrun simctl launch $DEV com.mkai.runner 2>&1 | tee -a "$S"
          sleep 90
          xcrun simctl spawn $DEV launchctl list 2>&1 | grep -i mkai | tee -a "$S"
          xcrun simctl io $DEV screenshot ios-shot2.png
          for n in 1 2; do sips -Z 900 -s format jpeg -s formatOptions 70 ios-shot$n.png --out ios-small$n.jpg >/dev/null; { echo "<details><summary>ios-small$n.jpg base64</summary><pre>"; base64 -i ios-small$n.jpg; echo "</pre></details>"; } >> "$S"; done
          xcrun simctl spawn $DEV log show --last 6m --predicate 'process == "App"' 2>&1 | grep -i -E 'crash|jetsam|memory|terminated|fault' | tail -15 | cut -c1-240 | tee -a "$S"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-evidence
          path: |
            ios-shot1.png
            ios-shot2.png
            wrap/ios/sim-build.log
            wrap/ios/dev-build.log
          if-no-files-found: ignore
