name: android-runner
on:
  workflow_dispatch:
  push:
    paths: ['android-runner.version']
concurrency:
  group: android-runner
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Make a detector export with the pipeline self-test (synthetic, pipeline check only)
        run: |
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          npm install && npm run setup
          python trainer/selftest.py
      - name: Build the runner APK (Capacitor 7 debug build) with a CI-only bundled test export
        run: |
          mkdir -p wrap/www && cd wrap
          cp ../android-runner/www/* www/
          cp ../studio/jszip.min.js www/
          python ../android-runner/prep_test_zip.py ../build/selftest/out/app.zip www/test-export.zip
          sed -i 's#<script src="jszip.min.js">#<script>window.MKAI_TEST=1</script><script src="jszip.min.js">#' www/index.html
          ls -la www
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "MK AI Runner" com.mkai.runner --web-dir www
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
          python ../android-runner/icons.py android/app/src/main/res ../brand/icons.json
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
          ls -la app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: mkai-runner-debug-apk
          path: wrap/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: "Run in an Android emulator (WebView), offline inference check from logcat"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene
          script: APP_ID=com.mkai.runner bash android-runner/emulator_check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-emulator-screens
          path: |
            emu-shot.png
            emu-home.png
          if-no-files-found: ignore
