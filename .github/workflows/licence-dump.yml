name: licence-dump
on:
  workflow_dispatch:
  push:
    paths: ['licence-dump.version']
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Download the exact Windows wheels (licence files only are read; nothing is kept or published)
        run: |
          set -e
          mkdir w && cd w
          pip download --no-deps --only-binary=:all: --platform win_amd64 --python-version 3.12 --implementation cp numpy scipy tqdm pillow onnxruntime onnx safetensors tokenizers pydantic_core regex sympy mpmath 2>&1 | tail -3
          pip download --no-deps --only-binary=:all: --platform win_amd64 --python-version 3.12 --implementation cp torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -3
          pip download --no-deps --only-binary=:all: --platform any transformers timm packaging huggingface_hub 2>&1 | tail -3
          ls -la
      - name: Print licence files to the run summary
        run: |
          python - <<'PYEOF'
          import zipfile,glob,re,os
          out=open(os.environ['GITHUB_STEP_SUMMARY'],'w')
          pat=re.compile(r'(^|/)(LICEN[CS]E|COPYING|NOTICE|THIRD[-_ ]?PARTY|LICENSES?)[^/]*$',re.I)
          kw=re.compile(r'(GPL|LGPL|AGPL|GNU |Mozilla|MPL-|Intel|libgfortran|libquadmath|runtime library exception|dual[- ]licen|non-?commercial|Name: )',re.I)
          for w in sorted(glob.glob('w/*.whl')):
              z=zipfile.ZipFile(w)
              out.write('\n## %s (%d MB)\n'%(os.path.basename(w),os.path.getsize(w)//1000000))
              names=[n for n in z.namelist() if pat.search(n) and not n.endswith('/')]
              out.write('licence files: %s\n'%', '.join('%s(%d)'%(n.split('.dist-info/')[-1],z.getinfo(n).file_size) for n in names))
              bundled=[n for n in z.namelist() if re.search(r'\.libs/|/lib/.*\.dll$|\.dll$',n)]
              out.write('bundled binaries: %s\n'%', '.join(sorted(set(os.path.basename(n) for n in bundled))[:40]))
              for n in names:
                  t=z.read(n).decode('utf-8','ignore');L=t.split('\n')
                  out.write('\n### %s (%d lines)\n'%(n,len(L)))
                  hit=[i for i,l in enumerate(L) if kw.search(l)]
                  shown=0
                  for i in hit:
                      if shown>=25: break
                      out.write('L%d: %s\n'%(i+1,L[i].strip()[:220]));shown+=1
          out.close()
          PYEOF
          wc -c "$GITHUB_STEP_SUMMARY"
      - name: Targeted reads of the exact terms (open items)
        run: |
          python - <<'PYEOF'
          import zipfile,glob,re,os,urllib.request,io
          out=open(os.environ['GITHUB_STEP_SUMMARY'],'a')
          def ctx(title,text,pat,before=3,after=12,maxhits=4):
              L=text.split('\n');hits=[i for i,l in enumerate(L) if re.search(pat,l,re.I)]
              out.write('\n#### %s: %d hits for %s\n'%(title,len(hits),pat))
              last=-99;n=0
              for i in hits:
                  if i<last or n>=maxhits: continue
                  out.write('\n'.join('  '+x.strip()[:200] for x in L[max(0,i-before):i+after])+'\n  ---\n');last=i+after;n+=1
          out.write('\n\n# TARGETED READS\n')
          for w in sorted(glob.glob('w/*.whl')):
              z=zipfile.ZipFile(w);b=os.path.basename(w)
              dl=[n for n in z.namelist() if re.search(r'msvcp|vcruntime|libiomp|concrt|vcomp',n,re.I)]
              if dl: out.write('\n## %s contains: %s\n'%(b,dl))
              for n in z.namelist():
                  if re.search(r'(LICEN[CS]E|NOTICE|THIRD)[^/]*$',n,re.I) and not n.endswith('/'):
                      t=z.read(n).decode('utf-8','ignore')
                      if re.search(r'msvcp|vcruntime|libiomp|Intel.*OpenMP|OpenMP.*Intel',t,re.I):
                          ctx(b+'::'+n,t,r'msvcp|vcruntime|libiomp|Intel.*OpenMP|OpenMP.*Intel',3,25,3)
          # Python embeddable
          url='https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip'
          data=urllib.request.urlopen(url,timeout=120).read()
          z=zipfile.ZipFile(io.BytesIO(data))
          out.write('\n## python embed zip %d bytes, files: %s\n'%(len(data),sorted(z.namelist())))
          t=z.read('LICENSE.txt').decode('utf-8','ignore')
          out.write('LICENSE.txt lines: %d\n'%len(t.split('\n')))
          ctx('python LICENSE.txt',t,r'Microsoft|vcruntime|redistribut',2,10,6)
          out.close()
          PYEOF
