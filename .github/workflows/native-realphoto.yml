name: native-realphoto
on:
  workflow_dispatch:
  push:
    paths: ['native-realphoto.version']
concurrency:
  group: native-realphoto
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Install and prepare assets
        run: |
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyarrow huggingface_hub
          npm install && npm run setup
      - name: Real exports and real held-out photos (downloaded in CI only, nothing published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl build/ox
          gh run download 45623950928 -n realphoto-detect-export -D dl
          find dl -name app.zip | head -1 | xargs -I{} cp {} build/real-detect.zip
          python trainer/prep_bloodcell.py
          python trainer/oxford_classify.py | tee build/ox/eval.txt
          cp build/ox/export.zip build/real-classify.zip
          unzip -p build/real-detect.zip model.json > build/detect-model.json; cat build/detect-model.json
          ls -la build/real-*.zip
      - name: Same real detector export in headless Chrome, canvas vs PIL pixels (diagnosis of the small differences)
        run: |
          mkdir -p build/runner-www build/pt && cp android-runner/www/* build/runner-www/ && cp studio/jszip.min.js studio/ort.min.js studio/ort-wasm-simd-threaded*.mjs studio/ort-wasm-simd-threaded*.wasm build/runner-www/
          (cd build/pt && npm init -y >/dev/null && npm i puppeteer-core >/dev/null)
          cp android-runner/parity_test.mjs android-runner/parity_diag.mjs build/pt/
          python trainer/pil_pixels.py build/bc/test 320 build/bc/pil320.bin
          (cd build/pt && node parity_test.mjs ../runner-www ../real-detect.zip ../bc/test ../bc/dets.json ../bc/pil320.bin)
          { echo '#### Headless Chrome, canvas pixels'; echo '```'; python trainer/eval_detect.py dets build/bc/dets.json build/detect-model.json build/bc/test; echo '```'; echo '#### Headless Chrome, PIL pixels (preprocessing removed)'; echo '```'; python trainer/eval_detect.py dets build/bc/dets_pil.json build/detect-model.json build/bc/test; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the test APK (clean runner code + CI-only photo test files) with the real zips bundled
        run: |
          mkdir -p wrap/www/ph-det wrap/www/ph-cls apks && cd wrap
          cp ../android-runner/www/* www/
          cp ../studio/jszip.min.js ../studio/ort.min.js ../studio/ort-wasm-simd-threaded*.mjs ../studio/ort-wasm-simd-threaded*.wasm www/
          cp ../build/real-detect.zip ../build/real-classify.zip www/
          cp ../build/bc/test/*.jpg www/ph-det/
          python - <<'PY'
          import json,glob,os
          dt=sorted(os.path.basename(p) for p in glob.glob('www/ph-det/*.jpg'))
          ox=[t['file'] for t in json.load(open('../build/ox/test/truth.json'))['images']][:40]
          for f in ox: os.replace('../build/ox/test/'+f,'www/ph-cls/'+f)
          json.dump(ox,open('../build/ox/shown.json','w'))
          open('www/test-real-config.js','w').write('window.MKAI_REAL='+json.dumps([{'type':'classify','zip':'real-classify.zip','dir':'ph-cls','photos':ox},{'type':'detect','zip':'real-detect.zip','dir':'ph-det','photos':dt}])+';')
          PY
          cp ../android-runner/test-photos.js www/
          sed -i 's#<script src="runner.js">#<script src="test-real-config.js"></script><script src="runner.js">#; s#</body>#<script src="test-photos.js"></script></body>#' www/index.html
          grep -c "test-photos.js" www/index.html
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "MK AI Runner" com.mkai.runner --web-dir www
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
          python ../android-runner/icons.py android/app/src/main/res ../brand/icons.json
          npx cap sync android
          (cd android && ./gradlew assembleDebug --no-daemon)
          cp android/app/build/outputs/apk/debug/app-debug.apk ../apks/runner-real-test.apk
          ls -la ../apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: "Emulator (Android 13, airplane mode): real zips imported, real photos inferred natively"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          ram-size: 4096M
          heap-size: 576M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash android-runner/native_real_check.sh
      - name: Score the native results with the same evaluation code
        if: always()
        run: |
          python trainer/score_native.py native_log_full.txt build/native_dets.json build/ox/test | tee native-score.txt
          python trainer/eval_detect.py dets build/native_dets.json build/detect-model.json build/bc/test | tee -a native-score.txt
          { echo '### Native Android emulator (Android 13, x86_64, airplane mode on; NOT a physical device), real exported models, real held-out photos. Software benchmark only.'; echo '```'; cat native-score.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-real-evidence
          path: |
            native-score.txt
            native-real-evidence.txt
            native_real_lines.txt
            native_log_full.txt
            native-real-shot.png
          if-no-files-found: ignore
