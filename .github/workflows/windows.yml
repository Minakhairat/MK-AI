name: windows-selftest
on:
  workflow_dispatch:
  push:
    paths: ['windows.version']
concurrency:
  group: windows-selftest
  cancel-in-progress: true
jobs:
  selftest:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Python dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Launcher check mode (npm install, asset setup, file checks)
        shell: cmd
        run: |
          set MKAI_CHECK=1
          call start-windows.bat
      - name: Local server answers a status probe
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList 'server/studio_server.py','8000' -PassThru -NoNewWindow
          Start-Sleep 4
          $r = Invoke-RestMethod http://127.0.0.1:8000/api/status
          if ($r.state -ne 'idle') { throw "unexpected state $($r.state)" }
          $h = Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing
          if ($h.StatusCode -ne 200) { throw 'studio page not served' }
          Stop-Process $p
      - name: Detector pipeline self-test (synthetic data, 1 epoch, ONNX export)
        run: python trainer/selftest.py
