name: windows-selftest
on:
  workflow_dispatch:
  push:
    paths: ['windows.version']
concurrency:
  group: windows-selftest
  cancel-in-progress: true
jobs:
  selftest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Python dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Launcher error branches (no installs)
        shell: pwsh
        run: |
          $dir = $PWD.Path
          $pyDir = Split-Path (Get-Command python).Source
          $sys = "$env:SystemRoot\System32"
          # 1) no Python on PATH
          $env:MKAI_CHECK = '1'
          $out = cmd /c "set PATH=$sys&& cd /d $dir && start-windows.bat" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'Python was not found') { throw "no-python branch: exit $LASTEXITCODE`n$out" }
          # 2) Python but no Node
          $out = cmd /c "set PATH=$pyDir;$sys&& cd /d $dir && start-windows.bat" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'Node.js was not found') { throw "no-node branch: exit $LASTEXITCODE`n$out" }
          # 3) first run, user answers No at the Continue prompt (nothing is installed)
          Remove-Item Env:MKAI_CHECK
          if (Test-Path venv) { Remove-Item venv -Recurse -Force }
          $out = cmd /c "echo N| start-windows.bat" 2>&1 | Out-String
          if ($out -notmatch 'First run' -or $out -notmatch 'Stopped') { throw "prompt branch output:`n$out" }
          if (Test-Path venv\.deps) { throw 'venv was created after answering No' }
          Write-Host 'error and prompt branches behaved as expected'
          exit 0
      - name: Launcher check mode (npm install, asset setup, file checks)
        shell: cmd
        run: |
          set MKAI_CHECK=1
          call start-windows.bat
      - name: Local server answers a status probe
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList 'server/studio_server.py','8000' -PassThru -NoNewWindow
          Start-Sleep 4
          $r = Invoke-RestMethod http://127.0.0.1:8000/api/status
          if ($r.state -ne 'idle') { throw "unexpected state $($r.state)" }
          $h = Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing
          if ($h.StatusCode -ne 200) { throw 'studio page not served' }
          Stop-Process $p
      - name: Detector pipeline self-test (synthetic data, 1 epoch, ONNX export)
        run: python trainer/selftest.py

  continue-yes:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean first run, answer Yes at the Continue prompt (real install, then start)
        shell: pwsh
        run: |
          $dir = $PWD.Path
          if (Test-Path venv) { Remove-Item venv -Recurse -Force }
          $p = Start-Process cmd -ArgumentList '/c', "cd /d $dir && echo Y| start-windows.bat > launcher.log 2>&1" -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep 20
            try { $r = Invoke-RestMethod http://127.0.0.1:8000/api/status -TimeoutSec 5; if ($r.state -eq 'idle') { $ok = $true; break } } catch {}
            if ($p.HasExited) { break }
          }
          Get-Content launcher.log -Tail 40
          if (-not $ok) { throw 'server did not come up after answering Yes' }
          $h = Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing
          if ($h.StatusCode -ne 200) { throw 'studio page not served' }
          foreach ($f in 'favicon.svg','pwa-192x192.png','template/files.json','template/pwa-512x512.png') {
            $x = Invoke-WebRequest "http://127.0.0.1:8000/$f" -UseBasicParsing
            if ($x.StatusCode -ne 200) { throw "missing $f" }
          }
          Write-Host 'Continue=Yes path: install, setup, start and HTTP checks passed'
          taskkill /T /F /PID $p.Id | Out-Null
          exit 0
