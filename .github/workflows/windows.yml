name: windows-selftest
on:
  push:
  workflow_dispatch:
jobs:
  selftest:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Python dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Node dependencies and assets
        run: |
          npm install
          npm run setup
      - name: Check generated studio files exist
        run: |
          python -c "import os;assert all(os.path.exists(p) for p in ['studio/tf.min.js','studio/jszip.min.js','studio/base/model.json','studio/template/sw.js','build/detect-template/ort.min.js'])"
      - name: Detector pipeline self-test (synthetic data, 1 epoch, ONNX export)
        run: python trainer/selftest.py
