<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MK AI Runner</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: data:; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="theme-color" content="#1e2127">
<link rel="stylesheet" href="runner.css"></head>
<body><header><img src="favicon.svg" width="34" height="34" alt=""><h3>MK AI Runner</h3></header>
<section id="home">
<p>افتح تطبيق اتصدّر من MK AI Studio. الملف بيتقرأ على جهازك بس ومش بيترفع لأي مكان. التطبيق بياخد من الملف بيانات النموذج بس (الأسماء والأوزان)، ومبيشغّلش أي كود من جوّاه.</p>
<label class="btn">استيراد ملف zip<input id="f" type="file" accept=".zip,application/zip" hidden></label>
<p class="note" id="st"></p><div id="list"></div></section>
<section id="run" hidden>
<button class="sec" id="back" type="button">رجوع</button> <b id="title"></b>
<p id="rst"></p><label class="btn">اختيار صورة<input id="img" type="file" accept="image/*" hidden></label>
<button id="camb" type="button">تشغيل الكاميرا مباشر</button><p class="note" id="camn"></p>
<video id="v" playsinline muted></video><canvas id="c"></canvas><pre id="res"></pre></section>
<pre id="log"></pre>
<script src="jszip.min.js"></script><script src="ort.min.js"></script><script src="runner.js"></script></body></html>
